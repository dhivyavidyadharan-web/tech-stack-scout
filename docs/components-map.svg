<text x="373.5" y="248.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Adds a target company</text>
<text x="373.5" y="269.0" text-anchor="middle" font-size="16" fill="#2b2a3d">(GitHub org) or clicks</text>
<text x="373.5" y="290.0" text-anchor="middle" font-size="16" fill="#2b2a3d">“Refresh Intelligence”</text>
<rect x="539" y="347.0" width="255" height="100" rx="10" fill="#f3f6ff" stroke="#4a6fd8" stroke-width="2.2"/>
<text x="666.5" y="382.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Checks the org exists on</text>
<text x="666.5" y="403.0" text-anchor="middle" font-size="16" fill="#2b2a3d">GitHub; same-site + rate-</text>
<text x="666.5" y="424.0" text-anchor="middle" font-size="16" fill="#2b2a3d">limit guard; saves it</text>
<rect x="832" y="481.0" width="255" height="100" rx="10" fill="#effaf3" stroke="#3aa66b" stroke-width="2.2"/>
<text x="959.5" y="516.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Tables: companies ·</text>
<text x="959.5" y="537.0" text-anchor="middle" font-size="16" fill="#2b2a3d">intelligence · snapshots</text>
<text x="959.5" y="558.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Single source of truth</text>
<rect x="832" y="615.0" width="255" height="100" rx="10" fill="#effaf3" stroke="#3aa66b" stroke-width="2.2"/>
<text x="959.5" y="650.0" text-anchor="middle" font-size="16" fill="#2b2a3d">30 latest public repos:</text>
<text x="959.5" y="671.0" text-anchor="middle" font-size="16" fill="#2b2a3d">languages, commits, file</text>
<text x="959.5" y="692.0" text-anchor="middle" font-size="16" fill="#2b2a3d">trees, package.json, releases</text>
<rect x="832" y="749.0" width="255" height="100" rx="10" fill="#effaf3" stroke="#3aa66b" stroke-width="2.2"/>
<text x="959.5" y="784.0" text-anchor="middle" font-size="16" fill="#2b2a3d">6 job boards · Google News</text>
<text x="959.5" y="805.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Hacker News · blog RSS</text>
<text x="959.5" y="826.0" text-anchor="middle" font-size="16" fill="#2b2a3d">(hiring + what’s new)</text>
<rect x="1125" y="347.0" width="255" height="100" rx="10" fill="#fff8de" stroke="#e0b23a" stroke-width="2.2"/>
<text x="1252.5" y="382.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Code, not AI: language %,</text>
<text x="1252.5" y="403.0" text-anchor="middle" font-size="16" fill="#2b2a3d">infra from real files, velocity,</text>
<text x="1252.5" y="424.0" text-anchor="middle" font-size="16" fill="#2b2a3d">complexity, buying signals</text>
<rect x="1418" y="883.0" width="255" height="100" rx="10" fill="#fff1f3" stroke="#d9506b" stroke-width="2.2"/>
<text x="1545.5" y="907.5" text-anchor="middle" font-size="16" fill="#2b2a3d">Drops wrong-company news</text>
<text x="1545.5" y="928.5" text-anchor="middle" font-size="16" fill="#2b2a3d">Writes overview, 2-para summary,</text>
<text x="1545.5" y="949.5" text-anchor="middle" font-size="16" fill="#2b2a3d">why-it-matters, opener</text>
<text x="1545.5" y="970.5" text-anchor="middle" font-size="16" fill="#2b2a3d">Strict JSON only</text>
<rect x="1418" y="347.0" width="255" height="100" rx="10" fill="#fff1f3" stroke="#d9506b" stroke-width="2.2"/>
<text x="1545.5" y="382.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Validates JSON (zod), retries</text>
<text x="1545.5" y="403.0" text-anchor="middle" font-size="16" fill="#2b2a3d">once; template fallback;</text>
<text x="1545.5" y="424.0" text-anchor="middle" font-size="16" fill="#2b2a3d">saves result to Supabase</text>
<rect x="1711" y="213.0" width="255" height="100" rx="10" fill="#fff5e6" stroke="#e89a3c" stroke-width="2.2"/>
<text x="1838.5" y="248.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Account cards: stack, buying</text>
<text x="1838.5" y="269.0" text-anchor="middle" font-size="16" fill="#2b2a3d">signals, evidence links,</text>
<text x="1838.5" y="290.0" text-anchor="middle" font-size="16" fill="#2b2a3d">opener → copy to email/CRM</text>
<rect x="246" y="1017.0" width="255" height="100" rx="10" fill="#f3f6ff" stroke="#4a6fd8" stroke-width="2.2"/>
<text x="373.5" y="1052.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Weekly (Sun 00:00 UTC):</text>
<text x="373.5" y="1073.0" text-anchor="middle" font-size="16" fill="#2b2a3d">refresh stale accounts</text>
<text x="373.5" y="1094.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Daily: enrich new rows</text>
<rect x="1711" y="1151.0" width="255" height="100" rx="10" fill="#fff5e6" stroke="#e89a3c" stroke-width="2.2"/>
<text x="1838.5" y="1186.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Checks evidence links +</text>
<text x="1838.5" y="1207.0" text-anchor="middle" font-size="16" fill="#2b2a3d">Observed vs Hypothesis tags</text>
<text x="1838.5" y="1228.0" text-anchor="middle" font-size="16" fill="#2b2a3d">→ edits opener, sends</text>
<text x="22" y="1320" font-size="17" fill="#2b2a3d"><tspan font-weight="700" fill="#2e9b5f">Deliberately NOT built (scope cut):</tspan> CRM deal pipeline, sending emails, private-repo access, personal contact data, user accounts. Dora gives evidence-backed research and a <tspan font-weight="700">suggested</tspan> opener; <tspan font-weight="700">Nikhil still decides</tspan> what to send.</text>
